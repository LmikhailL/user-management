databaseChangeLog:
  - changeSet:
      id: create-registration-attempt-table
      author: Mike
      changes:
        - createTable:
            tableName: registration_attempt
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: ip_address
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uc_registration_attempt_ip_address
              - column:
                  name: window_start
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: attempt_count
                  type: INT
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: registration_attempt
